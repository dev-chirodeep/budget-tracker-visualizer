name: Test and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt Pillow
      - name: Check Python syntax
        run: python -m compileall -q main.py storage.py reporting.py benchmark.py tests scripts
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Open the desktop interface in a virtual display
        run: xvfb-run -a python -m scripts.smoke_gui
      - name: Capture a sample screenshot
        run: xvfb-run -a python -m scripts.capture_screenshot
      - name: Publish current screenshots to the repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Images/Dashboard-current.png Images/Dashboard-dark.png Images/demo.gif
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh actual app screenshots [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshot
          path: |
            Images/Dashboard-current.png
            Images/Dashboard-dark.png
            Images/demo.gif

  windows-app:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BudgetTracker --collect-all tkcalendar --collect-all babel main.py
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: BudgetTracker-Windows
          path: dist/BudgetTracker.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BudgetTracker-Windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/BudgetTracker.exe

  publish-screenshots:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: desktop-screenshot
          path: Images
      - name: Update screenshots when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Images/Dashboard-current.png Images/Dashboard-dark.png Images/demo.gif
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh screenshots from the tested desktop app'
            git push origin HEAD:main
          fi