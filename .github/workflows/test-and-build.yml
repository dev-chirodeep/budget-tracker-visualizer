name: Test and build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt Pillow
      - name: Check Python syntax
        run: python -m compileall -q main.py storage.py reporting.py benchmark.py tests scripts
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Open the desktop interface in a virtual display
        run: xvfb-run -a python -m scripts.smoke_gui
      - name: Capture a sample screenshot
        run: xvfb-run -a python -m scripts.capture_screenshot
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshot
          path: |
            Images/Dashboard-current.png
            Images/Dashboard-dark.png
            Images/demo.gif

  windows-app:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BudgetTracker --collect-all tkcalendar --collect-all babel main.py
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: BudgetTracker-Windows
          path: dist/BudgetTracker.exe

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BudgetTracker-Windows
          path: release
      - name: Publish first Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists; keeping the published version."
          else
            gh release create v1.0.0 release/BudgetTracker.exe \
              --title "Budget Tracker v1.0.0" \
              --notes "Desktop expense tracker with editing, filters, monthly budgets, charts, CSV/Excel/PDF reports and SQLite backups. Built from tested sources by GitHub Actions."
          fi
